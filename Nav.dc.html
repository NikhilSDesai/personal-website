<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:"Libre Franklin", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,p { margin:0; }
  nav.ed a { color:var(--nav-dim,#4a4b40); }
  nav.ed a[aria-current="page"] { color:var(--nav-ink,#14150f); border-bottom:1px solid var(--nav-ink,#14150f); }
</style>
</helmet>
<div style="border-bottom:1px solid var(--nav-rule,#d8d3c7);background:var(--nav-bg,#f4f2ee);position:sticky;top:0;z-index:20">
  <div style="max-width:1200px;margin:0 auto;padding:18px 32px;display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="./" style="text-decoration:none;color:var(--nav-ink,#14150f);font-size:15px;letter-spacing:0.16em;text-transform:uppercase;font-weight:400">Nikhil Desai</a>
    <nav class="ed" style="display:flex;gap:28px;flex-wrap:wrap">
      <a href="./" aria-current="{{ homeCurrent }}" style="text-decoration:none;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding-bottom:2px">Home</a>
      <a href="/experience" aria-current="{{ experienceCurrent }}" style="text-decoration:none;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding-bottom:2px">Experience</a>
      <a href="/writing" aria-current="{{ writingCurrent }}" style="text-decoration:none;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding-bottom:2px">Writing</a>
      <a href="/contact" aria-current="{{ contactCurrent }}" style="text-decoration:none;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding-bottom:2px">Contact</a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;experience&quot;,&quot;projects&quot;,&quot;climate&quot;,&quot;writing&quot;,&quot;contact&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current || "home";
    const mark = (id) => (cur === id ? "page" : null);
    return {
      homeCurrent: mark("home"),
      experienceCurrent: mark("experience"),
      projectsCurrent: mark("projects"),
      climateCurrent: mark("climate"),
      writingCurrent: mark("writing"),
      contactCurrent: mark("contact")
    };
  }
}
</script>
</body>
</html>
